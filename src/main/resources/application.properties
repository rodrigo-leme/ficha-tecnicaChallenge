spring.application.name=ficha-tecnica

# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/automotiva_db
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# ===============================
# FLYWAY (MIGRATIONS)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================
server.port=8085

# ===============================
# SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ===============================
# SECURITY
# ===============================
server.forward-headers-strategy=framework
app.security.require-https=true
app.security.allowed-origins=http://localhost:3000
app.security.jwt-secret=change-this-super-strong-secret-with-at-least-32-bytes
app.security.jwt-expiration-seconds=900
app.security.jwt-refresh-expiration-seconds=86400
app.security.jwt-issuer=ficha-tecnica-api
app.security.payload-signature-enabled=true
app.security.payload-signature-secret=change-this-payload-secret-with-at-least-32-bytes
app.security.rate-limit-requests-per-minute=120
app.security.data-encryption-key=change-this-data-key-with-at-least-32-bytes
app.security.data-retention-days=90
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

app.security.default-users.admin.username=admin
app.security.default-users.admin.password=admin123
app.security.default-users.analyst.username=analista
app.security.default-users.analyst.password=analista123
app.security.default-users.user.username=usuario
app.security.default-users.user.password=usuario123
